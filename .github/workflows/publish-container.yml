name: Publish container to GHCR

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type PUBLISH exactly to authorize publication."
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character lowercase git SHA that is expected to be published."
        required: true
        type: string
      release_tag:
        description: "Optional immutable release tag, for example v1.0.0 or v1.2.3-rc.1. Empty publishes only the SHA tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish immutable container
    runs-on:
      - self-hosted
      - Windows
      - X64
      - pharaon-publisher
    environment: ghcr-publish
    timeout-minutes: 180
    concurrency:
      group: ghcr-publish-pharaon-asset-factory
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kresocts/pharaon-asset-factory
      DOCKERFILE: docker/Dockerfile
      BUILD_CONTEXT: .
      PLATFORM: linux/amd64
      PUBLISHER_SCRIPT: scripts/publisher/publisher.ps1
      DOCKER_CONFIG_NAME: ghcr-docker-config-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Trusted-context preflight
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:EVENT_NAME -ne "workflow_dispatch") {
            throw "Publication is only allowed from workflow_dispatch."
          }
          if ($env:REPOSITORY -ne "kresocts/pharaon-asset-factory") {
            throw "Publication is refused for repository $env:REPOSITORY."
          }
          if ($env:REF -ne "refs/heads/main") {
            throw "Publication is refused for ref $env:REF."
          }
          if ($env:SHA -notmatch "^[0-9a-f]{40}$") {
            throw "github.sha is not a full 40-character lowercase hex SHA."
          }
          if ($env:EXPECTED_SHA -ne $env:SHA) {
            throw "expected_sha does not exactly match github.sha."
          }
          if ($env:CONFIRM_PUBLISH -ne "PUBLISH") {
            throw "confirm_publish must be exactly PUBLISH."
          }
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Publication requires a Windows self-hosted runner."
          }

          $releaseTag = $env:RELEASE_TAG
          if ($releaseTag -ne "") {
            if ($releaseTag.Length -gt 128) {
              throw "release_tag is excessively long."
            }
            if ($releaseTag -match "\s") {
              throw "release_tag contains whitespace."
            }
            if ($releaseTag.Contains("/")) {
              throw "release_tag contains a slash."
            }
            if ($releaseTag.ToLowerInvariant() -cne $releaseTag) {
              throw "release_tag contains uppercase characters."
            }
            if ($releaseTag -match '[&|;<>$]') {
              throw "release_tag contains shell metacharacters."
            }
            if (-not ($releaseTag -cmatch "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:[0-9a-z]+(?:-[0-9a-z]+)*)(?:\.(?:[0-9a-z]+(?:-[0-9a-z]+)*))*)?$")) {
              throw "release_tag must be an immutable version such as v1.0.0 or v1.2.3-rc.1."
            }
          }

          Write-Host "Trusted-context preflight passed."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Verify checked-out commit and clean tree
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_SHA) {
            throw "Checkout HEAD $head does not match expected SHA $env:EXPECTED_SHA."
          }
          $dirty = git status --porcelain
          if ($dirty) {
            throw "Working tree is not clean after checkout."
          }
          Write-Host "Checkout verified."

      - name: Load verified publisher script and revalidate tags
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $publisherScript = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISHER_SCRIPT
          . $publisherScript

          Assert-PublisherShaTag -Sha $env:GITHUB_SHA
          Assert-PublisherReleaseTag -ReleaseTag $env:RELEASE_TAG
          Write-Host "Shared publisher tag validation passed after checkout."

      - name: Docker and D-drive preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dockerOsLines = & docker info --format "{{.OSType}}" 2>$null
          $dockerOs = ($dockerOsLines -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $dockerOs -ne "linux") {
            throw "Docker server is unreachable or OSType is not linux."
          }

          & docker buildx version | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Buildx is not available."
          }

          if (-not (Test-Path -LiteralPath "D:\actions-runner")) {
            throw "D:\actions-runner does not exist."
          }

          $requiredFreeGiB = [int64]150
          $requiredFreeBytes = $requiredFreeGiB * 1GB
          $drive = Get-PSDrive -Name D
          if (-not $drive -or [int64]$drive.Free -lt $requiredFreeBytes) {
            throw "D drive does not have at least $requiredFreeGiB GiB free."
          }

          Write-Host "Docker Linux engine and D-drive preflight passed."

      - name: Authenticate to GHCR with temporary Docker config
        shell: pwsh
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $publisherScript = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISHER_SCRIPT
          . $publisherScript

          $config = New-PublisherTemporaryDockerConfig -BasePath $env:RUNNER_TEMP -Name $env:DOCKER_CONFIG_NAME
          $env:GHCR_TOKEN | docker --config $config login ghcr.io `
            --username $env:GHCR_USERNAME `
            --password-stdin
          if ($LASTEXITCODE -ne 0) {
            throw "GHCR login failed."
          }

          Write-Host "GHCR login completed using temporary Docker config."

      - name: Refuse existing requested tags
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $publisherScript = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISHER_SCRIPT
          . $publisherScript
          $config = Join-Path $env:RUNNER_TEMP $env:DOCKER_CONFIG_NAME

          $tagNames = @("sha-$env:GITHUB_SHA")
          if ($env:RELEASE_TAG) {
            $tagNames += $env:RELEASE_TAG
          }

          Assert-PublisherTagsAbsent -DockerConfig $config -Image $env:IMAGE -Tags $tagNames

      - name: Build and push immutable container
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $publisherScript = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISHER_SCRIPT
          . $publisherScript
          $config = Join-Path $env:RUNNER_TEMP $env:DOCKER_CONFIG_NAME
          $shaTag = "sha-$env:GITHUB_SHA"
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $shaTag }
          $metadataFile = Join-Path $env:RUNNER_TEMP "build-metadata.json"

          $labels = @{
            "org.opencontainers.image.source" = "https://github.com/kresocts/pharaon-asset-factory"
            "org.opencontainers.image.revision" = $env:GITHUB_SHA
            "org.opencontainers.image.version" = $version
            "org.opencontainers.image.description" = "Pharaon Asset Factory reproducible GPU worker"
          }

          Invoke-PublisherBuildxBuild `
            -DockerConfig $config `
            -Dockerfile $env:DOCKERFILE `
            -Platform $env:PLATFORM `
            -Context $env:BUILD_CONTEXT `
            -Image $env:IMAGE `
            -Sha $env:GITHUB_SHA `
            -ReleaseTag $env:RELEASE_TAG `
            -Labels $labels `
            -MetadataFile $metadataFile

      - name: Verify pushed digest and requested tags
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $publisherScript = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISHER_SCRIPT
          . $publisherScript
          $config = Join-Path $env:RUNNER_TEMP $env:DOCKER_CONFIG_NAME
          $metadataFile = Join-Path $env:RUNNER_TEMP "build-metadata.json"

          $digest = Read-PublisherBuildMetadataDigest -MetadataFile $metadataFile
          Assert-PublisherPushedDigest `
            -DockerConfig $config `
            -Image $env:IMAGE `
            -Sha $env:GITHUB_SHA `
            -ReleaseTag $env:RELEASE_TAG `
            -Digest $digest

          $digestQualified = Get-PublisherDigestQualifiedReference -Image $env:IMAGE -Digest $digest
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Published image: $digestQualified"
          Write-Host "Digest verification passed: $digestQualified"

      - name: Cleanup temporary Docker credentials and metadata
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $config = Join-Path $env:RUNNER_TEMP $env:DOCKER_CONFIG_NAME
          if (Test-Path -LiteralPath $config) {
            docker --config $config logout ghcr.io
            Remove-Item -LiteralPath $config -Recurse -Force
          }

          $metadataFile = Join-Path $env:RUNNER_TEMP "build-metadata.json"
          if (Test-Path -LiteralPath $metadataFile) {
            Remove-Item -LiteralPath $metadataFile -Force
          }
